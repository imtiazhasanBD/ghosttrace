services:
  postgres:
    image: postgres:16-alpine
    container_name: ghosttrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghosttrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghosttrace_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ghosttrace}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - ghosttrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghosttrace} -d ${POSTGRES_DB:-ghosttrace}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ghosttrace-net

  migration:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.migration
    container_name: ghosttrace-migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ghosttrace}:${POSTGRES_PASSWORD:-ghosttrace_dev_secret}@postgres:5432/${POSTGRES_DB:-ghosttrace}?schema=public
    networks:
      - ghosttrace-net
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: ghosttrace-api
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-ghosttrace}:${POSTGRES_PASSWORD:-ghosttrace_dev_secret}@postgres:5432/${POSTGRES_DB:-ghosttrace}?schema=public
      JWT_SECRET: ${JWT_SECRET:-ghosttrace_dev_jwt_secret_must_be_very_long_and_secure_key_123456789}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ghosttrace-net

  demo-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.demo-api
    container_name: ghosttrace-demo-api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${DEMO_API_PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-ghosttrace}:${POSTGRES_PASSWORD:-ghosttrace_dev_secret}@postgres:5432/${POSTGRES_DB:-ghosttrace}?schema=public
      GHOSTTRACE_ENDPOINT: http://api:3001/v1/traces
      GHOSTTRACE_API_KEY: ${GHOSTTRACE_API_KEY:-gt_live_default_demo_project_key_test_12345}
      GHOSTTRACE_SERVICE_NAME: demo-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ghosttrace-net

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: ghosttrace-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ghosttrace-net

volumes:
  ghosttrace_pgdata:
    driver: local

networks:
  ghosttrace-net:
    driver: bridge
